---
name: CI
on:
  push:
    branches:
      - master
    paths-ignore:
      - appveyor.yml
      - "**.md"
      - "**.txt"
  pull_request:
    branches:
      - master
    paths-ignore:
      - appveyor.yml
      - "**.md"
      - "**.txt"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    name: Ruby ${{ matrix.ruby }}${{ matrix.coverage && ' + coverage' || '' }}
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.2"
          - "3.3"
          - "4.0"
          - ruby-head
          - jruby-9.4
          - jruby-10.0
          - jruby-10.1
          - jruby-head
          - truffleruby-head
        include:
          - ruby: "2.0"
            os: ubuntu-24.04
          - ruby: "2.1"
            os: ubuntu-24.04
          - ruby: "2.2"
            os: ubuntu-24.04
          - ruby: "2.3"
            os: ubuntu-24.04
          - ruby: "2.4"
            os: ubuntu-24.04
          - ruby: "2.5"
            os: ubuntu-24.04
          - ruby: "2.6"
            os: ubuntu-24.04
          - ruby: "2.7"
            os: ubuntu-24.04
          - ruby: "3.0"
            os: ubuntu-24.04
          - ruby: "3.1"
            os: ubuntu-24.04
          - ruby: "3.4"
            coverage: true
          - ruby: jruby-9.2
            os: ubuntu-22.04
          - ruby: jruby-9.3
            os: ubuntu-24.04
    env:
      COVERAGE: ${{ matrix.coverage }}
      COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
    continue-on-error: ${{ endsWith(matrix.ruby, 'head') }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run tests${{ matrix.coverage && ' and report coverage' || '' }}
        run: bundle exec rake ci
